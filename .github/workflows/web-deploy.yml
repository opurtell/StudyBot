name: Web Deploy

on:
  push:
    branches: [main]
    paths:
      - "web/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: web-deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      TARGET: ${{ github.event.inputs.environment || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Skip until Cloudflare is configured
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set; skipping deploy. See web/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('wrangler.jsonc', 'utf8');
            const env = process.env.TARGET;
            const start = raw.indexOf('\"' + env + '\": {');
            const end = env === 'staging' ? raw.indexOf('\"production\": {') : raw.length;
            process.exit(raw.slice(start, end).includes('REPLACE_WITH') ? 0 : 1);
          "; then
            echo "::error::wrangler.jsonc still has REPLACE_WITH placeholders for $TARGET. See web/README.md."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.gate.outputs.ready == 'true'
        run: npm ci
      - if: steps.gate.outputs.ready == 'true'
        run: npm run typecheck && npm test
      - name: Deploy
        if: steps.gate.outputs.ready == 'true'
        run: npm run "deploy:$TARGET"
      - name: Smoke test
        if: steps.gate.outputs.ready == 'true' && vars.WEB_BASE_URL != ''
        env:
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
        run: |
          curl -fsS "$WEB_BASE_URL/api/health" | tee /dev/stderr | grep -q '"ok":true'
          curl -fsS -o /dev/null "$WEB_BASE_URL/"
